version: '3.8'

services:
  omipdf:
    build: .
    ports:
      - "3000:3000"
    environment:
      - NODE_ENV=production
      - PORT=3000
    restart: unless-stopped
    # Optional: set file size limits at nginx/proxy level
    # For S3 storage, add BUILT_IN_FORGE_API_URL and BUILT_IN_FORGE_API_KEY
